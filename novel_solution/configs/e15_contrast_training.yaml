experiment: e15_contrast_training
type: training
description: 'High-contrast fix (E11 negative): final recipe trained at 128 on smooth contrast 10^2/10^4/10^6 coefficients in the two-level role (network on 64), with and without the log a input, and in
  the multi-level role (bottom 32); 3 seeds'
results_dir: results/e15_contrast_training
checkpoint_dir: results/checkpoints
notebook_checkpoint_dir: ../reimplementation/results/checkpoints
cache_dir: results/datasets
paper_cache_dir: ../reimplementation/results/datasets
normalization: upstream
m_max: 20
krylov_iterations: 100
kind:
- grf2
- grf4
- grf6
grid: 128
seed:
- 0
- 1
- 2
settings:
  grf2:
    learning_rate: 0.0008
    features:
      32: 32
      64: 32
      128: 32
    batch_size:
      32: 32
      64: 32
  grf4:
    learning_rate: 0.0008
    features:
      32: 32
      64: 32
      128: 32
    batch_size:
      32: 32
      64: 32
  grf6:
    learning_rate: 0.0008
    features:
      32: 32
      64: 32
      128: 32
    batch_size:
      32: 32
      64: 32
collection:
  steps: 100
  floor: 1.0e-10
  chunk: 8
  round_fraction: 0.5
fine_tune:
  epochs: 30
  learning_rate_scale: 0.5
test:
  n_test: 100
  chunk: 20
  cap: 4grid
  tolerances:
  - 0.001
  - 1.0e-06
  - 1.0e-10
  timing_batches:
  - 1
  - 16
  timing_iterations: 50
variant:
- label: hc_2l2
  history: 1
  objective: step
  scale_weight: 0.05
  sampling: onpolicy
  rounds: 3
  init: train
  two_level:
    coarsen: 2
    smoother: chebyshev
    sweeps: 2
- label: hc_2l2_coef
  history: 1
  objective: step
  scale_weight: 0.05
  sampling: onpolicy
  rounds: 3
  init: train
  coefficient: true
  two_level:
    coarsen: 2
    smoother: chebyshev
    sweeps: 2
- label: hc_ml32
  history: 1
  objective: step
  scale_weight: 0.05
  sampling: onpolicy
  rounds: 3
  init: train
  two_level:
    coarse_grid: 32
    smoother: chebyshev
    sweeps: 2
