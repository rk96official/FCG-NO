experiment: u1_unified_main
type: main
description: 'Unified comparison with the paper''s methods: the final models (E14 final_2l2, E9 abl_m0 without history; trained at 32, 64 and 128 (one model per grid as in the paper, plus cross-grid), 5
  seeds) on the reproduction''s exact 20 test systems and initial guesses at 32, 64 and 128, two-level (network on grid/2) and multi-level (bottom 16), TF32, to 1e-12'
results_dir: results/u1_unified_main
checkpoint_dir: results/checkpoints
notebook_checkpoint_dir: ../reimplementation/results/checkpoints
cache_dir: results/datasets
paper_cache_dir: ../reimplementation/results/datasets
normalization: upstream
kind:
- poisson
- diffusion
seed:
- 0
- 1
- 2
- 3
- 4
model:
- label: final_2l2
  source: training
  train_grid: 32
  round: 3
- label: final_2l2
  source: training
  train_grid: 64
  round: 3
- label: final_2l2
  source: training
  train_grid: 128
  round: 3
- label: abl_m0
  source: training
  train_grid: 32
  round: 3
- label: abl_m0
  source: training
  train_grid: 64
  round: 3
- label: abl_m0
  source: training
  train_grid: 128
  round: 3
test_grid:
- 32
- 64
- 128
test:
  n_test: 20
  chunk: 20
  m_max: 20
  cap: 4grid
  active_floor: 1.0e-10
  tolerances:
  - 0.001
  - 1.0e-06
  - 1.0e-12
  timing_batches:
  - 1
  - 16
  timing_iterations: 50
variants:
- label: two_level_c2_tf32
  two_level:
    coarsen: 2
    smoother: chebyshev
    sweeps: 2
  precision: &id001
    dtype: float32
- label: multi_b16_tf32
  two_level:
    coarse_grid: 16
    smoother: chebyshev
    sweeps: 2
  precision: *id001
