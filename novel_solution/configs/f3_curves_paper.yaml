experiment: f3_curves_paper
type: main
description: 'Residual curves for the results package (Fig. 3): the paper''s best learned preconditioners (U-Net, DilResNet) and FCG-NO (SNO, notebook settings), trained at 128, in TF32 through the
  jitted GPU FCG, on the reproduction''s 20 test systems at 128 and 1024 (same settings as u1_paper_models, curves saved)'
results_dir: results/f3_curves
checkpoint_dir: results/checkpoints
notebook_checkpoint_dir: ../reimplementation/results/checkpoints
cache_dir: results/datasets
paper_cache_dir: ../reimplementation/results/datasets
normalization: upstream
kind:
- poisson
- diffusion
seed:
- 0
model:
- label: fcgno_sno_notebook
  source: reproduction
  architecture: sno
  tag: notebook
  train_grid: 128
- label: fcg_unet
  source: reproduction
  architecture: unet
  tag: paper
  train_grid: 128
- label: fcg_dilresnet
  source: reproduction
  architecture: dilresnet
  tag: paper
  train_grid: 128
test_grid:
- 128
- 1024
test:
  n_test: 20
  chunk: 4
  m_max: 20
  cap: 4grid
  active_floor: 1.0e-10
  save_curves: true
  tolerances:
  - 0.001
  - 1.0e-06
  - 1.0e-12
  timing_batches:
  - 1
  timing_iterations: 10
variants:
- label: plain_tf32
  precision:
    dtype: float32
