experiment: e2b_composed
type: composed
description: Combinations of the no-retraining fixes from E2 - smoothing wrapper, safeguard (with network every k-th step), TF32 network inference - on existing checkpoints, to test whether fewer iterations at a lower cost per iteration beat jitted CG in wall-clock. bfloat16 is excluded (E2 delta 0.65-0.8 on Diffusion)
results_dir: results/e2b_composed
cache_dir: results/datasets
paper_cache_dir: ../reimplementation/results/datasets
checkpoint_dir: ../reimplementation/results/checkpoints
normalization: upstream
kind: [poisson, diffusion]
seed: [0, 1, 2]
case:
  - {train_grid: 128, test_grid: 128, tag: paper}
  - {train_grid: 128, test_grid: 128, tag: notebook}
  - {train_grid: 32, test_grid: 128, tag: transfer}
  - {train_grid: 128, test_grid: 256, tag: transfer}
test:
  n_test: 100
  chunk: 20
  m_max: 20
  cap: 4grid
  active_floor: 1.0e-10
  tolerances: [1.0e-3, 1.0e-6, 1.0e-10]
  timing_batches: [1, 16]
  timing_iterations: 50
variants:
  - {label: base}
  - {label: tf32, precision: {dtype: float32}}
  - {label: wrapper_cheb2, wrapper: {smoother: chebyshev, sweeps: 2}}
  - {label: wrapper_cheb2_tf32, wrapper: {smoother: chebyshev, sweeps: 2}, precision: {dtype: float32}}
  - {label: wrapper_cheb4_tf32, wrapper: {smoother: chebyshev, sweeps: 4}, precision: {dtype: float32}}
  - {label: wrapper_cheb2_safeguard_tf32, wrapper: {smoother: chebyshev, sweeps: 2}, safeguard: {fallback: chebyshev, sweeps: 2}, precision: {dtype: float32}}
  - {label: wrapper_cheb2_safeguard_every2_tf32, wrapper: {smoother: chebyshev, sweeps: 2}, safeguard: {fallback: chebyshev, sweeps: 2, every: 2}, precision: {dtype: float32}}
  - {label: safeguard_every2_tf32, safeguard: {fallback: chebyshev, sweeps: 2, every: 2}, precision: {dtype: float32}}
  - {label: safeguard_every4_tf32, safeguard: {fallback: chebyshev, sweeps: 2, every: 4}, precision: {dtype: float32}}
  - {label: wrapper_cheb2_safeguard_every4, wrapper: {smoother: chebyshev, sweeps: 2}, safeguard: {fallback: chebyshev, sweeps: 2, every: 4}}
  - {label: wrapper_cheb2_safeguard_every4_tf32, wrapper: {smoother: chebyshev, sweeps: 2}, safeguard: {fallback: chebyshev, sweeps: 2, every: 4}, precision: {dtype: float32}}
