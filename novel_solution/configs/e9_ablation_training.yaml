experiment: e9_ablation_training
type: training
description: 'Ablations of the final recipe (E14: HC-NO, exact step loss, on-policy, trained in the two-level role on 64, 32 features): without history, with the Notay loss, with CG-trajectory data instead
  of on-policy rounds, and trained on the single grid (deployed in the two-level role zero-shot). Rounds, width, TF32 and safeguard ablations come from E14 and E12. 5 seeds'
results_dir: results/e9_ablation_training
checkpoint_dir: results/checkpoints
notebook_checkpoint_dir: ../reimplementation/results/checkpoints
cache_dir: results/datasets
paper_cache_dir: ../reimplementation/results/datasets
normalization: upstream
m_max: 20
krylov_iterations: 100
kind:
- poisson
- diffusion
grid: 128
seed:
- 0
- 1
- 2
- 3
- 4
settings:
  poisson:
    learning_rate: 0.001
    features:
      32: 32
      64: 32
      128: 32
    batch_size: {}
  diffusion:
    learning_rate: 0.0008
    features:
      32: 32
      64: 32
      128: 32
    batch_size:
      32: 32
      64: 32
collection:
  steps: 100
  floor: 1.0e-10
  chunk: 8
  round_fraction: 0.5
fine_tune:
  epochs: 30
  learning_rate_scale: 0.5
test:
  n_test: 100
  chunk: 20
  cap: 4grid
  tolerances:
  - 0.001
  - 1.0e-06
  - 1.0e-10
  timing_batches:
  - 1
  - 16
  timing_iterations: 50
variant:
- label: abl_m0
  history: 0
  objective: step
  scale_weight: 0.05
  sampling: onpolicy
  rounds: 3
  init: train
  two_level: &id001
    coarsen: 2
    smoother: chebyshev
    sweeps: 2
- label: abl_notay
  history: 1
  objective: notay
  scale_weight: 0.0
  sampling: onpolicy
  rounds: 3
  init: train
  two_level: *id001
- label: abl_cg
  history: 1
  objective: step
  scale_weight: 0.05
  sampling: cg
  rounds: 3
  init: train
  two_level: *id001
- label: abl_single
  history: 1
  objective: step
  scale_weight: 0.05
  sampling: onpolicy
  rounds: 3
  init: train
