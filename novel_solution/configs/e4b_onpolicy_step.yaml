experiment: e4b_onpolicy_step
type: training
description: '128. Memoryless on-policy training with the exact step loss (m0_on_step), added after the E3 pilot: it isolates the effect of history (h1_on_step in E4) from on-policy training with the step
  loss. Separate config so E4''s array indexing stays unchanged; results go to the E4 directory'
results_dir: results/e4_headline
checkpoint_dir: results/checkpoints
notebook_checkpoint_dir: ../reimplementation/results/checkpoints
cache_dir: results/datasets
paper_cache_dir: ../reimplementation/results/datasets
normalization: upstream
m_max: 20
krylov_iterations: 100
kind:
- poisson
- diffusion
grid: 128
seed:
- 0
- 1
- 2
settings:
  poisson:
    learning_rate: 0.001
    features:
      32: 32
      64: 32
      128: 32
    batch_size: {}
  diffusion:
    learning_rate: 0.0008
    features:
      32: 32
      64: 48
      128: 85
    batch_size:
      32: 32
      64: 32
collection:
  steps: 100
  floor: 1.0e-10
  chunk: 8
  round_fraction: 0.5
fine_tune:
  epochs: 30
  learning_rate_scale: 0.5
test:
  n_test: 100
  chunk: 20
  cap: 4grid
  tolerances:
  - 0.001
  - 1.0e-06
  - 1.0e-10
  timing_batches:
  - 1
  - 16
  timing_iterations: 50
variant:
- label: m0_on_step
  history: 0
  objective: step
  scale_weight: 0.05
  sampling: onpolicy
  rounds: 3
  init: train
