experiment: e2_supporting
type: supporting
description: Fixes that need no retraining, on existing checkpoints. Safeguarded FCG (midterm eq. 15) with identity, Jacobi or Chebyshev fallback, network every k-th step; smoothing wrapper (network as coarse correction); low-precision network inference with the Lemma 3 check; per-iteration cost. Own-grid 128 (paper, notebook) and cross-grid transfer (32->128, 64->256, 128->256)
results_dir: results/e2_supporting
cache_dir: results/datasets
paper_cache_dir: ../reimplementation/results/datasets
checkpoint_dir: ../reimplementation/results/checkpoints
normalization: upstream
kind: [poisson, diffusion]
seed: [0, 1, 2]
case:
  - {train_grid: 128, test_grid: 128, tag: paper}
  - {train_grid: 128, test_grid: 128, tag: notebook}
  - {train_grid: 32, test_grid: 128, tag: transfer}
  - {train_grid: 64, test_grid: 256, tag: transfer}
  - {train_grid: 128, test_grid: 256, tag: transfer}
test:
  n_test: 100
  chunk: 20
  m_max: 20
  cap: 4grid
  active_floor: 1.0e-10
  tolerances: [1.0e-3, 1.0e-6, 1.0e-10]
  timing_batches: [1, 16]
  timing_iterations: 50
variants:
  - {name: cg}
  - {name: base}
  - {name: safeguard, fallback: identity}
  - {name: safeguard, fallback: jacobi}
  - {name: safeguard, fallback: chebyshev, sweeps: 2}
  - {name: safeguard, fallback: chebyshev, sweeps: 2, every: 2}
  - {name: safeguard, fallback: chebyshev, sweeps: 2, every: 4}
  - {name: wrapper, smoother: jacobi, sweeps: 1}
  - {name: wrapper, smoother: jacobi, sweeps: 2}
  - {name: wrapper, smoother: chebyshev, sweeps: 2}
  - {name: precision, dtype: float32, matmul: highest}
  - {name: precision, dtype: float32}
  - {name: precision, dtype: bfloat16}
