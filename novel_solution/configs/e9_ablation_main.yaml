- label: two_level_c4_cheb2_tf32
  two_level:
    coarsen: 4
    smoother: chebyshev
    sweeps: 2
  precision:
    dtype: float32
- label: two_level_c8_cheb2_tf32
  two_level:
    coarsen: 8
    smoother: chebyshev
    sweeps: 2
  precision:
    dtype: float32
- label: two_level_c16_cheb2_tf32
  two_level:
    coarsen: 16
    smoother: chebyshev
    sweeps: 2
  precision:
    dtype: float32
- label: multi_b64_tf32
  two_level:
