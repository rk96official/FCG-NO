experiment: e11_training
type: training
description: 'Robustness of learned preconditioners to smooth high contrast (10^2, 10^4, 10^6) at 64: paper-style memoryless CG-data Notay model (trained here, no notebook checkpoint), HC-NO, and HC-NO
  with the log a input; 3 seeds'
results_dir: results/e11_training
checkpoint_dir: results/checkpoints
notebook_checkpoint_dir: ../reimplementation/results/checkpoints
cache_dir: results/datasets
paper_cache_dir: ../reimplementation/results/datasets
normalization: upstream
m_max: 20
krylov_iterations: 100
kind:
- grf2
- grf4
- grf6
grid: 64
seed:
- 0
- 1
- 2
settings:
  grf2: &id001
    learning_rate: 0.0008
    features:
      64: 48
      128: 85
    batch_size:
      64: 32
  grf4: *id001
  grf6: *id001
collection:
  steps: 100
  floor: 1.0e-10
  chunk: 16
  round_fraction: 0.5
fine_tune:
  epochs: 30
  learning_rate_scale: 0.5
test:
  n_test: 100
  chunk: 20
  cap: 4grid
  tolerances:
  - 0.001
  - 1.0e-06
  - 1.0e-10
  timing_batches:
  - 1
  - 16
  timing_iterations: 50
variant:
- label: m0_cg_notay
  history: 0
  objective: notay
  sampling: cg
  rounds: 0
  init: train
- label: h1_on_step
  history: 1
  objective: step
  scale_weight: 0.05
  sampling: onpolicy
  rounds: 3
  init: train
- label: c1h1_on_step
  history: 1
  coefficient: true
  objective: step
  scale_weight: 0.05
  sampling: onpolicy
  rounds: 3
  init: train
