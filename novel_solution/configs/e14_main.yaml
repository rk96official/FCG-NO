experiment: e14_main
type: main
description: 'Final recipe in deployment: e14_final_training models (5 seeds) at 128, 256, 512 and 1024 with TF32, coarsening 2 to 16 (final_2l2 trained for a 64 coarse grid, final_2l4 for 32) and the safeguard;
  baselines from e14_classical_1024 / e14_amg_1024 at 1024'
results_dir: results/e14_main
checkpoint_dir: results/checkpoints
notebook_checkpoint_dir: ../reimplementation/results/checkpoints
cache_dir: results/datasets
paper_cache_dir: ../reimplementation/results/datasets
normalization: upstream
kind:
- poisson
- diffusion
seed:
- 0
- 1
- 2
- 3
- 4
model:
- label: final_2l2
  source: training
  train_grid: 128
  round: 3
- label: final_2l4
  source: training
  train_grid: 128
  round: 3
test_grid:
- 128
- 256
- 512
- 1024
test:
  n_test: 100
  chunk: 20
  m_max: 20
  cap: 4grid
  active_floor: 1.0e-10
  tolerances:
  - 0.001
  - 1.0e-06
  - 1.0e-10
  timing_batches:
  - 1
  - 16
  timing_iterations: 50
variants:
- label: two_level_c2_cheb2_tf32
  two_level:
    coarsen: 2
    smoother: chebyshev
    sweeps: 2
  precision:
    dtype: float32
- label: two_level_c4_cheb2_tf32
  two_level:
    coarsen: 4
    smoother: chebyshev
    sweeps: 2
  precision:
    dtype: float32
- label: two_level_c8_cheb2_tf32
  two_level:
    coarsen: 8
    smoother: chebyshev
    sweeps: 2
  precision:
    dtype: float32
- label: two_level_c16_cheb2_tf32
  two_level:
    coarsen: 16
    smoother: chebyshev
    sweeps: 2
  precision:
    dtype: float32
- label: two_level_c4_cheb2_safeguard_tf32
  two_level:
    coarsen: 4
    smoother: chebyshev
    sweeps: 2
  safeguard:
    fallback: chebyshev
    sweeps: 2
  precision:
    dtype: float32
- label: two_level_c8_cheb2_safeguard_tf32
  two_level:
    coarsen: 8
    smoother: chebyshev
    sweeps: 2
  safeguard:
    fallback: chebyshev
    sweeps: 2
  precision:
    dtype: float32
