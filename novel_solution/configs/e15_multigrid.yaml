experiment: e15_multigrid
type: multigrid
description: 'High contrast vs classical multigrid on GPU, same job: Galerkin GMG, two-level with V-cycle / Chebyshev(8) coarse solves, setup-free rediscretized multi-level, and the E15 networks (seed 0;
  two-level on 64 or multi-level to 32) plus the E14 Diffusion model zero-shot, TF32'
results_dir: results/e15_multigrid
checkpoint_dir: results/checkpoints
notebook_checkpoint_dir: ../reimplementation/results/checkpoints
cache_dir: results/datasets
paper_cache_dir: ../reimplementation/results/datasets
normalization: upstream
kind:
- grf2
- grf4
- grf6
grid:
- 128
- 256
- 512
test:
  n_test: 100
  chunk: 20
  m_max: 20
  cap: 4grid
  tolerances:
  - 0.001
  - 1.0e-06
  - 1.0e-10
  timing_batches:
  - 1
  - 16
  timing_iterations: 50
variants:
- label: gmg_vcycle_fp32coarse
  method: gmg
  sweeps: 2
  coarse_dtype: float32
- label: tl64_vcycle
  method: two_level
  coarse_grid: 64
  coarse: vcycle
  coarse_sweeps: 2
- label: tl64_chebyshev8
  method: two_level
  coarse_grid: 64
  coarse: chebyshev
  coarse_sweeps: 8
- label: redisc_dense16
  method: rediscretized
  coarse_grid: 16
  smoother: chebyshev
  sweeps: 2
  bottom: dense
  bottom_sweeps: 8
- label: tl64_hc
  method: network
  coarse_grid: 64
  model:
    label: hc_2l2
    train_grid: 128
    round: 3
    seed: 0
- label: tl64_hc_coef
  method: network
  coarse_grid: 64
  model:
    label: hc_2l2_coef
    train_grid: 128
    round: 3
    seed: 0
- label: ml32_hc
  method: network
  levels: multi
  coarse_grid: 32
  model:
    label: hc_ml32
    train_grid: 128
    round: 3
    seed: 0
- label: tl64_e14_diffusion
  method: network
  coarse_grid: 64
  model:
    label: final_2l2
    train_grid: 128
    round: 3
    seed: 0
    kind: diffusion
- label: ml64_e14_diffusion
  method: network
  levels: multi
  coarse_grid: 64
  model:
    label: final_2l2
    train_grid: 128
    round: 3
    seed: 0
    kind: diffusion
